services:
  api:
    build:
      context: ./backend
    container_name: forensics-sqlite-api
    restart: unless-stopped
    volumes:
      - forensics_sqlite_data:/var/lib/forensics-explainer
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    container_name: forensics-caddy-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  forensics_sqlite_data:
